<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      background: #f7fafc;
    }
    .kpi-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      padding: 1.5rem 1.75rem;
      text-align: center;
      width: 280px;
    }
    .kpi-title {
      color: #4A5568;
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 0.4rem;
    }
    .kpi-value {
      color: #ED8936;
      font-size: 2.25rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
    }
    .kpi-caption {
      color: #718096;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="kpi-card">
    <div class="kpi-title">AI Base Scenario (2035)</div>
    <div class="kpi-value">1193 TWh</div>
    <div class="kpi-caption">186.8% growth from 2024</div>
  </div>
</body>
</html>
